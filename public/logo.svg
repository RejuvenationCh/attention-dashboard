<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfbfb"/>
      <stop offset="1" stop-color="#e7eaee"/>
    </linearGradient>
  </defs>
  <!-- glass tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="7" y="7" width="498" height="498" rx="109" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="5"/>
  <!-- day ring: track + 72% arc (2*pi*148 = 929.9) -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="rgba(25,28,29,0.08)" stroke-width="52"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="#3b82f6" stroke-width="52" stroke-linecap="round"
          stroke-dasharray="669.5 929.9" transform="rotate(-90 256 256)"/>
  <!-- attention pulse dot -->
  <circle cx="256" cy="256" r="47" fill="#b75b00"/>
</svg>
